name: Gold refining feature checks

on:
  push:
    branches: [feature/gold-refining-ui-preview]
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/gold-refining-checks.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # The repository's backend lockfile predates the current dependency graph.
      # Generate the corrected lock for review, then use a clean install.
      - run: npm install --package-lock-only --ignore-scripts
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-backend-lockfile
          path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npx vitest run src/gold-refining/gold-refining.service.spec.ts
        working-directory: backend
