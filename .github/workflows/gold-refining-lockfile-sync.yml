name: Sync backend lockfile (feature branch only)

on:
  push:
    branches:
      - feature/gold-refining-ui-preview
    paths:
      - .github/workflows/gold-refining-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'chie41/factory-management' && github.ref == 'refs/heads/feature/gold-refining-ui-preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate backend package lock, preserving package.json
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only generated backend lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo 'Already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/package-lock.json
          git commit -m 'chore(gold): synchronize backend lockfile for clean CI installs'
          git push origin HEAD:feature/gold-refining-ui-preview
